name: Build and publish WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Build for the browser
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${EMSDK}/upstream/emscripten/cache/sysroot"
          cargo build --release --target wasm32-unknown-emscripten
        env:
          EMCC_CFLAGS: "-O3 -sUSE_GLFW=3 -sASSERTIONS=1 -sWASM=1 -sASYNCIFY -sGL_ENABLE_GET_PROC_ADDRESS=1"

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp target/wasm32-unknown-emscripten/release/deps/sturdy_parakeet.js site/
          cp target/wasm32-unknown-emscripten/release/deps/sturdy_parakeet.wasm site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Sturdy Parakeet</title>
              <style>
                body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #222; }
                canvas { width: min(100vw, 800px); height: auto; aspect-ratio: 4 / 3; background: #fff; }
              </style>
            </head>
            <body>
              <canvas id="canvas" width="800" height="600"></canvas>
              <script>
                var Module = { canvas: document.getElementById('canvas') };
              </script>
              <script src="sturdy_parakeet.js"></script>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
